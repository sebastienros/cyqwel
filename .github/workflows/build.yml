name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - 'README.md'

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Build
        run: |
          dotnet build src/Cyqwel/Cyqwel.csproj --configuration Release
          dotnet build tests/Cyqwel.Tests/Cyqwel.Tests.csproj --configuration Release

      - name: Test
        run: dotnet test tests/Cyqwel.Tests/Cyqwel.Tests.csproj --configuration Release --no-build
