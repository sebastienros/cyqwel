name: Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Test corpus extractors
        run: python -m unittest discover -s tools/tsql_compat -p "test_*.py"

      - name: Build
        run: |
          dotnet build src/Cyqwel/Cyqwel.csproj --configuration Release
          dotnet build tests/Cyqwel.Tests/Cyqwel.Tests.csproj --configuration Release

      - name: Test
        run: dotnet test tests/Cyqwel.Tests/Cyqwel.Tests.csproj --configuration Release --no-build

      - name: Pack preview packages
        if: github.repository == 'sebastienros/cyqwel' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Cyqwel/Cyqwel.csproj --output artifacts --configuration Release -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True

      - name: Push preview packages to Feedz
        if: github.repository == 'sebastienros/cyqwel' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
        run: |
          set -euo pipefail
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/cyqwel/nuget/index.json --skip-duplicate
          done
          # Previews used to be versioned <prefix>-preview-<run number>, which NuGet orders as text (preview-999 is
          # newer than preview-1000) and above every <prefix>-preview.<run number>. Delete them so they don't shadow newer builds.
          for package in artifacts/*.nupkg; do
            id=$(basename "$package" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+-.*$//' | tr '[:upper:]' '[:lower:]')
            for version in $(curl -fsS "https://f.feedz.io/sebastienros/cyqwel/nuget/v3/packages/$id/index.json" | jq -r '.versions[] | select(test("-preview-[0-9]+$"))'); do
              dotnet nuget delete "$id" "$version" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/cyqwel/nuget/index.json --non-interactive
            done
          done
